<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' data: https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>ガレキ積み帳</title>
<meta name="theme-color" content="#161A1B">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="積み帳">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a workbench shelf — sticky header with stock summary, filter chips, a single column of kit cards; detail, edit and backup open as full-height sheets. */
/* 端末の設定にかかわらずダークで固定（Androidの下のバーの色と揃えるため） */
:root{
  --bg:#161A1B; --surface:#202627; --sunken:#1A1F20; --ink:#E6EBEA; --muted:#97A2A1; --line:#323A3B;
  --tape:#E8C14E; --tape-ink:#211A05; --done:#5DB582; --warn:#E07A4E;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);min-height:100%;overscroll-behavior-y:none}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.02em;white-space:nowrap}
h1 span{display:inline-block;background:var(--tape);color:var(--tape-ink);padding:0 8px;transform:rotate(-1.5deg);margin-right:2px}
.brand-r{display:flex;align-items:center;gap:10px;min-width:0}
.stock{font-size:13px;color:var(--muted);white-space:nowrap}
.stock b{color:var(--ink);font-family:var(--f-data);font-size:15px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:8px}
.tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;font-size:16px}
.tools input{flex:1}
.tools select{flex:none;max-width:42%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip .num{font-size:11px;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{display:grid;gap:10px;padding-top:4px;grid-template-columns:minmax(0,1fr)}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.thumb{width:76px;height:76px;border-radius:7px;background:var(--sunken);display:grid;place-items:center;color:var(--muted);font-size:11px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{min-width:0;display:grid;gap:3px}
.card .name{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.card .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:1px 8px;border-radius:4px;background:var(--sunken);color:var(--muted);letter-spacing:.04em}
.pill.s6{background:var(--done);color:var(--surface)}
.pill.wip{background:var(--tape);color:var(--tape-ink)}
.age{font-size:11px;color:var(--muted)}
.age.old{color:var(--warn)}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;width:100%;max-width:140px}
.steps i{height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--tape)}
.steps.done i.on{background:var(--done)}

.empty,.notice{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;color:var(--muted);font-size:14px}
.notice{border-style:solid;text-align:left;font-size:13px}
.remind{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--tape) 20%,var(--surface));border:1px solid var(--tape);border-radius:var(--r);padding:8px 12px;font-size:13px}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;
  background:var(--tape);color:var(--tape-ink);border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.18)}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .wrap{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 8px;border-bottom:1px solid var(--line)}
.bar h2{font-size:16px;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500}
.btn.primary{background:var(--tape);color:var(--tape-ink);border-color:var(--tape);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%;padding:12px}

.gallery{display:grid;gap:8px;min-width:0}
.gallery .main{width:100%;max-height:62vh;object-fit:contain;border-radius:var(--r);background:var(--sunken);display:block}
.gallery .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.gallery .thumbs button{padding:0;border:2px solid transparent;border-radius:7px;overflow:hidden;aspect-ratio:1;background:var(--sunken)}
.gallery .thumbs button[aria-pressed="true"]{border-color:var(--tape)}
.gallery .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .none{width:100%;aspect-ratio:16/9;border-radius:var(--r);background:var(--sunken);display:grid;place-items:center;color:var(--muted);font-size:13px}
.dname{font-size:20px;font-weight:700;margin:0;text-wrap:balance;line-height:1.35}
.advance{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.advance .steps{max-width:none}
.advance .steps i{height:6px}
.stepnames{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10px;color:var(--muted);text-align:center}
.stepnames .cur{color:var(--ink);font-weight:700}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
dt{color:var(--muted);font-size:12px;letter-spacing:.06em;padding-top:2px}
dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.box h3{margin:0 0 4px;font-size:15px}
.box p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.log{display:grid;gap:0;margin:0;padding:0;list-style:none}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .dot{width:10px;height:10px;border-radius:50%;background:var(--tape)}
.log li.s6 .dot{background:var(--done)}
.log .st{font-weight:700;min-width:0}
.log .dur{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.log input{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:14px;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 4px;color:var(--muted);min-width:0}
.log input:focus{border-color:var(--line);background:var(--surface)}
.box h3 .sub{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--warn)}

form{display:grid;gap:14px}
.f{display:grid;gap:4px}
.f label,.flabel{font-size:12px;color:var(--muted);letter-spacing:.06em}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0;font-size:16px}
.f input[type="date"]{min-height:44px;-webkit-appearance:none;appearance:none}
.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.two>*{min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink);border-color:var(--tape);font-weight:700}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunken)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.ph.up{display:grid;place-items:center;font-size:11px;color:var(--muted)}
.addph{position:relative;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted)}
.addph input,.filepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:40px}
.filepick{position:relative;display:block}
.err{color:var(--warn);font-size:13px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}

/* 同期・リンク */
#openBackup[data-state="needtap"],#openBackup[data-state="error"]{border-color:var(--warn);color:var(--warn)}
#openBackup[data-state="ok"]{color:var(--done);border-color:color-mix(in srgb,var(--done) 45%,var(--line))}
#openBackup[data-state="syncing"]{color:var(--ink)}
.small{font-size:12px;color:var(--muted);margin:8px 0 0}
.stack{display:grid;gap:8px}
.stack .btn{text-align:left;line-height:1.4}
.legal{display:flex;gap:16px;justify-content:center;font-size:12px;margin:4px 0 0}
.legal a,.foot a{color:var(--muted)}
.foot{display:flex;gap:16px;justify-content:center;font-size:12px;padding-block:20px 0}

/* 初回の案内 */
#intro{z-index:25}
#intro .wrap{max-width:520px;min-height:100%;display:flex;flex-direction:column;gap:20px;padding-block:20px 8px}
.intro-top{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--tape)}
.intro-body{flex:1;display:grid;align-content:start;gap:14px}
.intro-body h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.4;margin:0;text-wrap:balance}
.intro-body h2 span{background:var(--tape);color:var(--tape-ink);padding:0 6px}
.intro-body p{margin:0;font-size:15px}
.intro-body .note{font-size:13px;color:var(--muted)}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feat li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px}
.feat b{display:block;font-size:15px}
.feat .ic{width:30px;height:30px;border-radius:8px;background:var(--tape);color:var(--tape-ink);display:grid;place-items:center;font-weight:700;font-family:var(--f-data);font-size:13px}
.howto{margin:0;padding-left:1.4em;display:grid;gap:6px;font-size:15px}
.howto kbd{font-family:var(--f-body);font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:0 6px;white-space:nowrap}
.intro-demo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.intro-demo .steps{max-width:none}
.intro-demo .steps i{height:6px}
.intro-nav{display:flex;gap:10px;justify-content:space-between;align-items:center}
.intro-nav .btn{padding:12px 18px}
.intro-nav .grow{flex:1}
.intro-actions{display:grid;gap:8px}
.ok{color:var(--done);font-weight:700}

/* 購入日・イベント */
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);letter-spacing:0;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--tape)}
.f input:disabled{opacity:.45}
#e-evpick{margin-top:6px;color:var(--muted)}
.filled{animation:fill 1.6s ease-out}
@keyframes fill{from{background:color-mix(in srgb,var(--tape) 35%,var(--surface))}}

/* 一覧の補助（PCの右側に出す概要） */
.overview{display:grid;gap:16px;padding-block:24px}
.overview h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.overview .lead{color:var(--muted);font-size:14px;margin:0}
.stepcount{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.stepcount div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center;display:grid;gap:2px}
.stepcount b{font-family:var(--f-data);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stepcount span{font-size:11px;color:var(--muted)}
.stepcount .zero b{color:var(--muted);opacity:.5}
.oldlist{list-style:none;margin:0;padding:0}
.oldlist li{border-top:1px solid var(--line)}
.oldlist li:first-child{border-top:0}
.oldlist button{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;padding:8px 0;border:0;background:transparent;text-align:left}
.oldlist .t{width:44px;height:44px;border-radius:6px;background:var(--sunken);overflow:hidden}
.oldlist .t img{width:100%;height:100%;object-fit:cover;display:block}
.oldlist .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.oldlist .d{font-size:12px;color:var(--warn);white-space:nowrap}
.kbd{font-family:var(--f-data);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}

/* ---------- PC：一覧と詳細を左右に並べる ---------- */
@media (min-width:960px){
  :root{--listw:420px}
  body{padding-bottom:110px}
  body > .wrap{max-width:var(--listw);margin:0}
  .card{transition:border-color .12s,background .12s}
  .card:hover{border-color:color-mix(in srgb,var(--tape) 55%,var(--line))}
  .card[aria-current="true"]{border-color:var(--tape);background:color-mix(in srgb,var(--tape) 10%,var(--surface));box-shadow:inset 3px 0 0 var(--tape)}
  .fab{left:max(16px,env(safe-area-inset-left,0px));right:auto;width:var(--listw);border-radius:10px;bottom:18px}
  #detail{inset:0 0 0 calc(max(16px,env(safe-area-inset-left,0px)) + var(--listw) + 24px);z-index:4;border-left:1px solid var(--line);
    padding-left:40px;padding-right:40px;animation:none}
  #detail .wrap{max-width:860px;margin:0 auto}
  #detail [data-a="close"]{visibility:hidden}
  #detail .gallery .main{max-height:58vh}
  #detail .detail-cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
  #intro{inset:8vh 0 auto 0;margin:0 auto;width:min(560px,calc(100vw - 48px));max-height:84vh;border-radius:14px;border:1px solid var(--line);
    box-shadow:0 0 0 100vmax rgba(10,14,15,.45),0 20px 50px rgba(0,0,0,.25);padding:28px}
  #editor,#backup{inset:4vh 0 auto 0;margin:0 auto;width:min(760px,calc(100vw - 48px));max-height:92vh;border-radius:14px;border:1px solid var(--line);
    box-shadow:0 0 0 100vmax rgba(10,14,15,.45),0 20px 50px rgba(0,0,0,.25);padding-left:28px;padding-right:28px;padding-bottom:28px}
  #editor .wrap,#backup .wrap{max-width:none}
  #editor .bar,#backup .bar{padding-top:18px}
  .photos{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media (min-width:1280px){
  :root{--listw:460px}
  #detail .wrap{max-width:1040px}
  #detail .detail-cols{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
  #detail .detail-cols > .gallery{position:sticky;top:64px}
  #detail .detail-cols .gallery .main{max-height:70vh}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1><span>ガレキ</span>積み帳</h1>
      <div class="brand-r">
        <div class="stock" id="stock">読み込み中…</div>
        <button class="iconbtn" id="openBackup">バックアップ</button>
      </div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="検索（キット名・原型師など）" aria-label="検索">
      <select id="sort" aria-label="並び順">
        <option value="old">積みが古い順</option>
        <option value="new">新しい順</option>
        <option value="name">名前順</option>
      </select>
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="工程で絞り込み"></div>
  </header>
  <main id="list" class="list"></main>
  <footer class="foot"><a href="#" id="openIntro">使い方</a><a href="privacy.html">プライバシーポリシー</a><a href="terms.html">利用規約</a></footer>
</div>
<button class="fab" id="fab">＋ キットを登録</button>
<section class="sheet" id="detail" hidden></section>
<section class="sheet" id="editor" hidden></section>
<section class="sheet" id="backup" hidden></section>
<section class="sheet" id="intro" hidden role="dialog" aria-modal="true" aria-labelledby="intro-title"></section>
<div class="toast" id="toast" hidden></div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script src="events.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
